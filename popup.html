<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Daily Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="logo" class="logo">
        <div>
          <h1 class="title">LeetCode Daily</h1>
          <span class="subtitle">每日挑戰狀態追蹤</span>
        </div>
      </div>
      <button id="refreshBtn" class="icon-btn" title="立即重新檢查">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16">
          <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </header>

    <!-- Status Card -->
    <section class="status-section" id="statusCard">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusText">載入中...</span>
      </div>

      <!-- Problem Info Box -->
      <div class="problem-box" id="problemBox">
        <div class="problem-header">
          <span class="problem-id" id="problemId">--</span>
          <span class="difficulty-tag" id="difficultyTag">--</span>
        </div>
        <div class="problem-title" id="problemTitle">正在獲取今日題目...</div>
      </div>

      <!-- Meta Info Rows -->
      <div class="meta-info">
        <div class="meta-row">
          <span class="meta-label">上次檢查</span>
          <span class="meta-value" id="lastCheckTime">--</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">UTC 00:00 換日</span>
          <span class="meta-value" id="resetCountdown">--</span>
        </div>
      </div>
    </section>

    <!-- Action Button -->
    <footer class="action-footer">
      <a href="https://leetcode.com/problemset/all/" target="_blank" class="btn-primary" id="openProblemBtn">
        前往 LeetCode 今日挑戰
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
