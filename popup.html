<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Daily Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="card-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="logo" class="logo">
        <div>
          <h1 class="title">LeetCode Reminder</h1>
          <span class="subtitle" id="subtitle">每日挑戰 & 周賽提醒</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="langBtn" class="lang-btn" title="切換語言 / Switch language">EN</button>
        <button id="refreshBtn" class="icon-btn" title="立即重新檢查">
          <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16">
            <path fill="currentColor"
              d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Card -->
    <section class="status-section" id="statusCard">
      <!-- Problem Info Box (Clickable Link) -->
      <a class="problem-box" id="problemBox" href="https://leetcode.com/problemset/all/" target="_blank"
        rel="noopener noreferrer">
        <div class="problem-title" id="problemTitle">正在獲取今日題目...</div>
        <div class="problem-footer">
          <span class="difficulty-tag" id="difficultyTag">--</span>
          <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-label" id="statusText">載入中...</span>
          </div>
        </div>
      </a>

      <!-- Meta Info Rows -->
      <div class="meta-info">
        <div class="meta-row">
          <span class="meta-label" id="labelLastCheck">上次檢查</span>
          <span class="meta-value" id="lastCheckTime">--</span>
        </div>
        <div class="meta-row">
          <span class="meta-label" id="labelResetCountdown">UTC 00:00 換日</span>
          <span class="meta-value" id="resetCountdown">--</span>
        </div>
      </div>
    </section>

    <!-- Contests Section -->
    <section class="contest-section" id="contestSection">
      <div class="section-title-row">
        <span class="section-title" id="contestSectionTitle">周賽活動</span>
      </div>

      <!-- Weekly Contest Card -->
      <div class="contest-card" id="weeklyCard">
        <div class="contest-main">
          <a class="contest-link" id="weeklyLink" href="https://leetcode.com/contest/" target="_blank" rel="noopener noreferrer">
            <span class="contest-title" id="weeklyTitle">Weekly Contest</span>
          </a>
          <span class="contest-time" id="weeklyCountdown">計算中...</span>
        </div>
        <label class="reminder-label" title="開始前 1 小時發送桌面推播提醒">
          <input type="checkbox" id="weeklyReminderCheckbox" class="reminder-checkbox" checked>
          <span class="checkbox-text" id="weeklyReminderText">1h 前提醒</span>
        </label>
      </div>

      <!-- Biweekly Contest Card -->
      <div class="contest-card" id="biweeklyCard">
        <div class="contest-main">
          <a class="contest-link" id="biweeklyLink" href="https://leetcode.com/contest/" target="_blank" rel="noopener noreferrer">
            <span class="contest-title" id="biweeklyTitle">Biweekly Contest</span>
          </a>
          <span class="contest-time" id="biweeklyCountdown">計算中...</span>
        </div>
        <label class="reminder-label" title="開始前 1 小時發送桌面推播提醒">
          <input type="checkbox" id="biweeklyReminderCheckbox" class="reminder-checkbox" checked>
          <span class="checkbox-text" id="biweeklyReminderText">1h 前提醒</span>
        </label>
      </div>
    </section>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
